name: Bug report
description: Report an Android, preview or build failure.
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include the expected behavior and steps to reproduce.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment and evidence
      description: App version, Android version/device or JDK/OS, and redacted logs or CI run link.
    validations:
      required: true
