# SPDX-License-Identifier: Apache-2.0
name: Security

on:
  workflow_call:
  schedule:
    - cron: "37 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan history with redacted output
        run: >-
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: .github/workflows/ci.yml:codeql/language:${{ matrix.language }}

  codeql-csharp:
    name: CodeQL (csharp)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: csharp
          build-mode: manual
      # AND.40 decision 22 and the restore: the host test projects reference the libraries that also target net10.0-android,
      # and a locked restore of those projects evaluates the android target, which needs the Android workload (NETSDK1147).
      # The same pinned workload set as the maui job is installed for the restore. The analysis itself builds the net10.0
      # target (-f net10.0), which is the host-run code; the Android-only sources are covered by the maui job.
      - name: Install the pinned MAUI workload set for the locked restore
        shell: bash
        run: dotnet workload install android maui-android --version 10.0.401
      # Manual build mode (AND.40 decision 12): an explicit locked restore and Release build of the host-run C# projects,
      # so that CodeQL observes the compiled sources. The Android app projects are covered by the maui job, not by this analysis.
      - name: Locked restore and Release build of the host-run C# projects
        shell: bash
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/nuget-codeql-csharp
        run: |
          mkdir -p "$NUGET_PACKAGES"
          dotnet restore tests/ArcForges.Mobile.Policy/ArcForges.Mobile.Policy.csproj --locked-mode
          dotnet restore tests/ArcForges.Mobile.Tests/ArcForges.Mobile.Tests.csproj --locked-mode
          dotnet build tests/ArcForges.Mobile.Policy/ArcForges.Mobile.Policy.csproj -c Release --no-restore -nologo -f net10.0
          dotnet build tests/ArcForges.Mobile.Tests/ArcForges.Mobile.Tests.csproj -c Release --no-restore -nologo -f net10.0
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: .github/workflows/ci.yml:codeql-csharp
