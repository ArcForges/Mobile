version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: nuget
    directories:
      - "/"
      - "/src/ArcForges.Mobile"
      - "/src/core/ArcForges.Mobile.Network"
      - "/src/core/ArcForges.Mobile.Security"
      - "/tests/ArcForges.Mobile.Policy"
      - "/tests/ArcForges.Mobile.Tests"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      maui:
        patterns: ["Microsoft.Maui*", "Microsoft.Android*", "Xamarin*"]
      contracts:
        patterns: ["ArcForges.Contracts*"]
      tests:
        patterns: ["Microsoft.NET.Test.Sdk", "xunit*"]
