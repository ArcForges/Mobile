# SPDX-License-Identifier: Apache-2.0
[versions]
agp = "9.4.1"
kotlin = "2.4.20"
compose = "1.12.1"
material3 = "1.9.0"
hot-reload = "1.2.0"
activity = "1.13.0"
contracts = "1.0.0-ci.60.1"
connect = "0.9.0"
coroutines = "1.11.0"
junit = "4.13.2"
androidx-test-runner = "1.7.0"
androidx-test-junit = "1.3.0"
spotless = "8.10.2"

[libraries]
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose" }
compose-ui-test-junit4 = { module = "org.jetbrains.compose.ui:ui-test-junit4", version.ref = "compose" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
contracts-client = { module = "io.github.arcforges:contracts-connect-client", version.ref = "contracts" }
connect-okhttp = { module = "com.connectrpc:connect-kotlin-okhttp", version.ref = "connect" }
connect-javalite = { module = "com.connectrpc:connect-kotlin-google-javalite-ext", version.ref = "connect" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
hot-reload = { id = "org.jetbrains.compose.hot-reload", version.ref = "hot-reload" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
